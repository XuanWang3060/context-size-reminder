# Context-limit reminders for the dsh web profile.
#
# Register this bundle with:
#   dsh plugin --profile web add context-size-reminder
# or add the row below to your profile's cordis.patch.yml manually.

- insert:
    - id: context-size-reminder
      name: 'context-size-reminder'
      config:
        thresholdTokens: 1000000
